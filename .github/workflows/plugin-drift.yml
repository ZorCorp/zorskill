name: Plugin drift detector

# Catches a plugin whose OWN repo shipped a new version that was never carried
# into this marketplace (a teammate releasing without running zorskill-dev).
# Every 30 min it advances any such pointer + bumps the marketplace/README and,
# ONLY if `check` passes, commits and pushes to main. A broken plugin's tip aborts —
# a broken marketplace is never published.
#
# PRIVATE plugin repos: the default GITHUB_TOKEN is scoped to THIS repo only, so it
# cannot clone a private plugin submodule (e.g. gcp-bq). To include private repos,
# add a read-only token as the `SUBMODULE_READ_TOKEN` secret (see "Init submodules"
# below). Without it, any unreachable submodule is simply skipped — the run still
# succeeds and the public plugins still carry in; skipped private plugins are carried
# in manually via `/zorskill-dev:release <name> <x.y.z>`.

on:
  schedule:
    # Every 30 min so a plugin's own `Release` workflow (bump + tag in its repo)
    # is carried into the marketplace within ~30-60 min.
    # GitHub schedules run late under load, so treat this as "within an hour", not exact.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: plugin-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      # Check out the marketplace only. persist-credentials (default true) wires the
      # default GITHUB_TOKEN for the `git push origin main` the drift step does — that
      # write is to THIS repo, so the built-in token is enough. Submodules are inited
      # separately below so one unreachable repo can't abort the whole checkout.
      - name: Checkout marketplace
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Init submodules (private repos included if a read token is set)
        env:
          # OPTIONAL. A read-only token (fine-grained PAT or GitHub App token) that can
          # read PRIVATE plugin repos. Only needs Contents:read on those repos. If unset,
          # private/unreachable submodules are skipped (public ones still init fine).
          SUBMODULE_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN }}
        run: |
          set -euo pipefail
          # Anon-first: init each submodule over anonymous https (public repos need no
          # credential). Only a repo that FAILS falls back to the read token — so the
          # token needs read access to just the PRIVATE repo(s) (e.g. gcp-bq), nothing
          # more. The `origin` (zorskill) push is never rerouted; it keeps using the
          # default GITHUB_TOKEN persisted by checkout above.
          names="$(git config --file .gitmodules --get-regexp '\.path$' | sed -E 's/^submodule\.(.*)\.path .*/\1/')"
          for name in ${names}; do
            path="$(git config --file .gitmodules --get "submodule.${name}.path")"
            url="$(git config --file .gitmodules --get "submodule.${name}.url")"
            if git submodule update --init "${path}" >/dev/null 2>&1; then
              echo "  ✓ init ${path}"
              continue
            fi
            if [ -n "${SUBMODULE_READ_TOKEN:-}" ]; then
              base="${url%.git}"; slug="${base#https://github.com/}"
              git config --global url."https://x-access-token:${SUBMODULE_READ_TOKEN}@github.com/${slug}".insteadOf "${base}"
              git config --global url."https://x-access-token:${SUBMODULE_READ_TOKEN}@github.com/${slug}.git".insteadOf "${base}.git"
              if git submodule update --init "${path}" >/dev/null 2>&1; then
                echo "  ✓ init ${path} (via read token)"
              else
                echo "  ⚠ skip ${path} (read token lacks access?)"
              fi
            else
              echo "  ⚠ skip ${path} (private, no SUBMODULE_READ_TOKEN — carried in manually)"
            fi
          done

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect + carry in drifted plugins (check-gated, auto-push)
        # zorskill-dev.sh drift --push:
        #   • scans every INITIALIZED plugin: marketplace entry version vs the repo tip's
        #     plugin.json version (unreachable/uninitialized submodules are skipped)
        #   • advances any that shipped a new version, syncs marketplace + README
        #   • runs `check` as a HARD GATE — aborts/reverts if a tip is structurally broken
        #   • commits and pushes main ONLY on a clean pass; no drift = no-op
        run: bash plugins/zorskill-dev/scripts/zorskill-dev.sh drift --push
